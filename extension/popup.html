<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube AI Video Chatbot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="header-title">Yt-GenAI</h1>
        <div class="active-video-pill">
          <span class="video-dot"></span>
          <span id="videoTitleText" class="video-pill-title">Detecting video...</span>
          <span id="videoIdText" style="display:none"></span>
        </div>
      </div>
      <div class="header-right">
        <div id="statusBadge" class="status-badge status-checking" title="Backend status">
          <span class="status-dot"></span>
          <span id="statusText" class="status-label">Checking</span>
        </div>
        <button id="settingsBtn" class="icon-btn" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="content-scroll-area">
      <!-- Greeting / Prompts Landing Box -->
      <div id="greetingBox" class="greeting-box">
        <h2 class="greeting-text">How can I help you?</h2>
        <div class="quick-chips">
          <button type="button" class="chip-btn" data-prompt="Summarize this video in 3 key bullet points.">Summarize this video</button>
          <button type="button" class="chip-btn" data-prompt="Explain this video step by step in simple terms.">Explain</button>
          <button type="button" class="chip-btn" data-prompt="What are the most important insights or takeaways?">Key Takeaways</button>
          <button type="button" class="chip-btn" data-prompt="Translate the key points into Hindi.">Translate</button>
        </div>
      </div>

      <!-- Chat Messages Window -->
      <div id="chatMessages" class="chat-messages hidden"></div>
    </main>

    <!-- Quick Prompts Toolbar (Available during chat) -->
    <div id="chatQuickChips" class="chat-chips-toolbar hidden">
      <button type="button" class="chip-btn-mini" data-prompt="Summarize this video in 3 key bullet points.">⚡ Summarize</button>
      <button type="button" class="chip-btn-mini" data-prompt="What are the key takeaways?">💡 Key Takeaways</button>
      <button type="button" class="chip-btn-mini" data-prompt="Explain in simple Hinglish.">🇮🇳 Hinglish</button>
    </div>

    <!-- Typing / Loading Indicator -->
    <div id="loadingIndicator" class="loading-bar hidden">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <span class="loading-text">Thinking...</span>
    </div>

    <!-- Chat Input Section (Floating Pill) -->
    <footer class="chat-footer">
      <form id="chatForm" class="chat-form">
        <textarea 
          id="questionInput" 
          placeholder="Ask something..."
          rows="1"
          required
        ></textarea>
        <button type="submit" id="sendBtn" class="send-btn" title="Send (Enter)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </form>
    </footer>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Settings</h2>
          <button type="button" id="closeSettingsBtn" class="close-icon-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Backend URL</label>
            <input type="text" id="serverUrlInput" value="http://127.0.0.1:8000" placeholder="API URL" />
          </div>
          <div class="action-row">
            <button type="button" id="testConnectionBtn" class="secondary-btn">Test Backend</button>
            <button type="button" id="clearChatBtn" class="danger-btn">Clear Chat</button>
          </div>
          <div id="serverTestResult" class="test-result-box hidden"></div>

          <div class="form-group" style="margin-top: 14px;">
            <label>Manual YouTube URL or ID</label>
            <div style="display:flex; gap: 8px;">
              <input type="text" id="manualVideoInput" placeholder="e.g. w2tidSx0Zhk" style="margin-bottom:0;" />
              <button type="button" id="saveVideoBtn" class="secondary-btn" style="width: auto; padding: 0 14px;">Set</button>
            </div>
            <button type="button" id="demoVideoBtn" class="text-link-btn" style="margin-top:6px;">⚡ Reset to Demo Video</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
